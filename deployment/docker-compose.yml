services:
  db:
    image: ankane/pgvector:latest
    container_name: investigation_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_db_pw}
      POSTGRES_DB: ${POSTGRES_DB:-thesis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-thesis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/ekarobyanto/rag-llm-investigation-evaluation:latest
    container_name: investigation_app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-change_me_secure_db_pw}@db:5432/${POSTGRES_DB:-thesis}"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      APP_PASSWORD: ${APP_PASSWORD:-investigation2027}
      AUTH_SECRET: ${AUTH_SECRET}
      WS_PORT: 3001
    expose:
      - "3000"
      - "3001"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: investigation_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app

  certbot:
    image: certbot/certbot:latest
    container_name: investigation_certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_etc:
  certbot_www:
