name: Build & Deploy

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy container to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: POSTGRES_PASSWORD,OPENAI_API_KEY,APP_PASSWORD,AUTH_SECRET,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            mkdir -p /opt/rag-llm-investigation/nginx
            cd /opt/rag-llm-investigation

            # 1. Fetch latest deployment configuration files
            curl -fsSL https://raw.githubusercontent.com/${GITHUB_ACTOR}/rag-llm-investigation-evaluation/master/deployment/docker-compose.yml -o docker-compose.yml
            curl -fsSL https://raw.githubusercontent.com/${GITHUB_ACTOR}/rag-llm-investigation-evaluation/master/deployment/nginx/default.conf -o nginx/default.conf
            curl -fsSL https://raw.githubusercontent.com/${GITHUB_ACTOR}/rag-llm-investigation-evaluation/master/deployment/init-ssl.sh -o init-ssl.sh
            chmod +x init-ssl.sh

            # 2. Automatically generate .env on VPS from GitHub Secrets
            cat << EOF > .env
            POSTGRES_USER=admin
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=thesis
            OPENAI_API_KEY=${OPENAI_API_KEY}
            OPENAI_MODEL=gpt-5.6-luna
            APP_PASSWORD=${APP_PASSWORD}
            AUTH_SECRET=${AUTH_SECRET}
            WS_PORT=3001
            EOF
            chmod 600 .env

            # 3. Log into GitHub Container Registry
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # 4. Pull newest images
            docker compose pull

            # 5. Start database container
            docker compose up -d db

            # 6. Run database migrations & seed case docket data
            docker compose run --rm app prisma migrate deploy
            docker compose run --rm app node prisma/seed.js

            # 7. Ensure fallback certificate exists for Nginx startup
            docker compose run --rm --entrypoint \
              "sh -c 'if [ ! -f /etc/letsencrypt/live/investigation.robyantoeka.my.id/fullchain.pem ]; then \
                mkdir -p /etc/letsencrypt/live/investigation.robyantoeka.my.id && \
                openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                  -keyout /etc/letsencrypt/live/investigation.robyantoeka.my.id/privkey.pem \
                  -out /etc/letsencrypt/live/investigation.robyantoeka.my.id/fullchain.pem \
                  -subj \"/CN=localhost\"; \
              fi'" certbot

            # 8. Start/reload application, nginx reverse proxy, and certbot
            docker compose up -d --remove-orphans app nginx certbot

            # 9. Request / renew Let's Encrypt SSL certificate once domain is pointed
            docker compose run --rm --entrypoint \
              "certbot certonly --webroot -w /var/www/certbot \
                --register-unsafely-without-email --agree-tos \
                -d investigation.robyantoeka.my.id --non-interactive --keep-until-expiring" certbot || true
            docker compose exec -T nginx nginx -s reload || true

            # 10. Clean up unused images to preserve disk space
            docker image prune -f
