name: Build & Deploy

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy container to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: POSTGRES_PASSWORD,OPENAI_API_KEY,APP_PASSWORD,AUTH_SECRET,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            mkdir -p /opt/rag-llm-investigation
            cd /opt/rag-llm-investigation

            # 1. Fetch latest production docker-compose file
            curl -fsSL https://raw.githubusercontent.com/${GITHUB_ACTOR}/rag-llm-investigation-evaluation/master/docker-compose.prod.yml -o docker-compose.yml

            # 2. Automatically generate .env on VPS from GitHub Secrets
            cat << EOF > .env
            POSTGRES_USER=admin
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=thesis
            OPENAI_API_KEY=${OPENAI_API_KEY}
            OPENAI_MODEL=gpt-5.6-luna
            APP_PASSWORD=${APP_PASSWORD}
            AUTH_SECRET=${AUTH_SECRET}
            WS_PORT=3001
            EOF
            chmod 600 .env

            # 3. Log into GitHub Container Registry
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # 4. Pull newest images
            docker compose pull

            # 5. Start database container
            docker compose up -d db

            # 6. Run database migrations & seed case docket data
            docker compose run --rm app npx prisma migrate deploy
            docker compose run --rm app npm run seed

            # 7. Start/reload the application container
            docker compose up -d --remove-orphans app

            # 8. Clean up unused images to preserve disk space
            docker image prune -f
